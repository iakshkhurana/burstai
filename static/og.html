<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>

<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#EEF2FC;font-family:Lexend,system-ui,sans-serif;color:#0E1B3D;position:relative}
.blob{position:absolute;right:-160px;bottom:-260px;width:720px;height:720px;border-radius:50%;background:#DCE3FB}
.logo{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:12px;font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;letter-spacing:-.04em}
h1{position:absolute;left:64px;top:150px;margin:0;width:620px;font-family:'Bricolage Grotesque';font-weight:800;font-size:72px;line-height:1;letter-spacing:-.045em}
.hl{background:#C6F432;padding:0 10px;border-radius:14px;box-shadow:inset 0 -6px 0 rgba(14,27,61,.12)}
p{position:absolute;left:64px;top:430px;margin:0;width:560px;font-size:24px;line-height:1.5;font-weight:300;color:#3D4966}
.pill{position:absolute;left:64px;bottom:56px;display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid #0E1B3D;border-radius:999px;padding:8px 18px 8px 8px;font-size:18px;font-weight:500}
.pill span{background:#C6F432;border-radius:999px;padding:4px 12px;font-weight:600}
.card{position:absolute;right:120px;top:120px;width:300px;background:#fff;border:2px solid #0E1B3D;border-radius:26px;box-shadow:10px 10px 0 #0E1B3D;overflow:hidden;transform:rotate(-4deg)}
.card .h{background:#2F4BEA;color:#fff;padding:20px 22px;border-bottom:2px solid #0E1B3D}
.card .h small{font-size:15px;opacity:.9;display:block}.card .h b{font-family:'Bricolage Grotesque';font-weight:800;font-size:58px;line-height:1;letter-spacing:-.04em}
.card .r{padding:18px 22px;display:flex;flex-direction:column;gap:14px;font-size:17px}
.card .r div{display:flex;align-items:center;gap:12px}.card .r i{width:16px;height:16px;border-radius:50%;border:2px solid #0E1B3D}.card .r span{flex:1}
.chip{position:absolute;right:70px;bottom:120px;background:#0E1B3D;color:#fff;border-radius:22px;padding:18px 24px;box-shadow:8px 8px 0 #8B5CF6;display:flex;align-items:center;gap:16px;transform:rotate(3deg)}
.chip small{display:block;font-size:15px;color:#C9D1EA}.chip b{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;line-height:1}
.burst{position:absolute;right:40px;top:30px;filter:drop-shadow(8px 8px 0 #0E1B3D)}
</style></head><body>
<div class="blob"></div>

<div class="logo"><svg width="44" height="44" viewBox="0 0 32 32"><path d="M16 1l3.2 9.1L28 6l-4.1 8.8L31 16l-7.1 1.2L28 26l-8.8-4.1L16 31l-3.2-9.1L4 26l4.1-8.8L1 16l7.1-1.2L4 6l8.8 4.1z" fill="#C6F432" stroke="#0E1B3D" stroke-width="1.4" stroke-linejoin="round"/></svg>burstai</div>
<h1>Plagiarism checker &amp; AI detector that <span class="hl">shows its work.</span></h1>
<p>Copied text, AI-written passages and grammar in one free scan. Every flag linked to its source.</p>
