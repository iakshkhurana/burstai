<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My writing — BurstAI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/burst.css">
<link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body class="mepage">

<header class="topbar">
  <a href="/" class="logo" aria-label="BurstAI home">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1l3.2 9.1L28 6l-4.1 8.8L31 16l-7.1 1.2L28 26l-8.8-4.1L16 31l-3.2-9.1L4 26l4.1-8.8L1 16l7.1-1.2L4 6l8.8 4.1z" fill="#C6F432" stroke="#0E1B3D" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <span class="word">burstai</span>
  </a>
  <nav class="crumb" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span class="cur">My writing</span></nav>
  <div class="right">
    <a href="/" class="btn btn-lime" id="newscan">New scan</a>
    <button type="button" class="btn" id="logout">Log out</button>
  </div>
</header>

<main class="me-main">
  <header class="me-head">
    <div><div class="me-welcome" id="welcome">Welcome back</div><h1>My writing</h1></div>
    <button type="button" class="avatar" id="avatar" aria-label="Profile">A</button>
  </header>

  <section class="streak-card">
    <div class="streak-top">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="#0E1B3D" aria-hidden="true"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg></span>
      <div><div class="big" id="streak">0 days</div><div class="small" id="streak-sub">writing streak</div></div>
    </div>
    <div class="days" id="days" aria-hidden="true"></div>
  </section>

  <section class="trend-card">
    <div class="row"><h2>Originality trend</h2><span id="trend-sub">last 8 scans</span></div>
    <div class="trend-bars" id="trend" aria-hidden="true"></div>
    <div class="trend-note" id="trend-note"></div>
  </section>

  <section class="recent-card" id="reports">
    <h2>Recent scans</h2>
    <div class="recent-list" id="recent"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/me.js"></script>
</body>
</html>
