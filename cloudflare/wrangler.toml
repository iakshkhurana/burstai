name = "burstai"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Keep variables/secrets added in the Cloudflare dashboard across git deploys (otherwise [vars] below replaces them).
keep_vars = true

# The whole ./static folder is served as static assets by the Worker (free, cached at the edge).
[assets]
directory = "../static"
binding = "ASSETS"
# Let the Worker see every request first (pages need PUBLIC_URL injected and noindex headers).
run_worker_first = true

# D1 (free tier) holds users, sessions, saved scans, signed report copies and rate-limit counters.
# Create it once in the dashboard (or `wrangler d1 create burstai`) and paste the id below.
# Tables are created automatically by the Worker on first use.
[[d1_databases]]
binding = "DB"
database_name = "burstai"
database_id = "c34acf33-fe51-4f8a-82e1-b30cde48466e"

[vars]
# Public URL of the deployed site (no trailing slash) - used for canonical / sitemap / OG links.
PUBLIC_URL = "https://burstai.online"
# Fallback address of the Python engine. Normally the engine registers its current (tunnel) address
# itself via scripts/start_engine.ps1, which takes precedence; set this only for a fixed address
# (named tunnel or VM). See DEPLOY.md.
ENGINE_URL = ""

# Secret (dashboard: Settings -> Variables and Secrets -> type "Secret", or `wrangler secret put ENGINE_TOKEN`):
#   ENGINE_TOKEN   shared secret sent to the engine as X-Engine-Token, and the key that verifies signed
#                  results. Must equal BURSTAI_ENGINE_TOKEN on the engine. Never put it in this file.
