name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (no ML stack; language models are disabled in tests)
        run: pip install -r requirements-ci.txt
      - name: Unit and API tests
        run: python -m pytest tests/test_core.py tests/test_api.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          for f in static/js/*.js cloudflare/src/worker.js; do node --check "$f"; done
      - name: No secrets or third-party hosts in shipped pages
        run: |
          ! grep -R -n -E "fonts\.googleapis|fonts\.gstatic|AIza[0-9A-Za-z_-]{20,}" static/ cloudflare/
